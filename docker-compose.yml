services:
  garden-ledger:
    build: .
    image: garden-ledger:latest
    container_name: garden-ledger
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      NODE_ENV: production
      PORT: 3000
      SQLITE_PATH: /data/garden-ledger.sqlite
      UPLOAD_DIR: /data/uploads
    volumes:
      - garden-ledger-data:/data
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  garden-ledger-data:
